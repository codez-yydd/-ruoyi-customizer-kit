[package]
name = "ruoyi-forge"
version = "1.0.1"
description = "RuoYi Forge / 若依锻造台 — 若依新项目初始化快速定制工具"
authors = ["RuoYi Forge"]
edition = "2021"
default-run = "ruoyi-forge"

[lib]
# `_lib` 后缀用于避免 lib 名与 bin 名冲突（Windows 上尤为关键）
name = "ruoyi_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forge-cli"
path = "src/bin/forge_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地文件扫描与改造所需
walkdir = "2"
regex = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
serde_yaml = "0.9"
# admin 密码 BCrypt 加密（与 Spring Security BCryptPasswordEncoder 兼容）
bcrypt = "0.15"
# JWT 随机 secret 生成
rand = "0.8"
# 文本编码检测与 GBK 转码（非 UTF-8 项目文件参与改造）
encoding_rs = "0.8"
# Nacos config_info 写回后重算 md5（对反转义 yaml 原文做 hex 小写）
md-5 = "0.10"
clap = { version = "4", features = ["derive"] }
# 官方仓库 archive zip / git 浅克隆（Gitee 网页 zip 会登录墙，拉取走 git）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "http2"] }

[dev-dependencies]
tempfile = "3"
