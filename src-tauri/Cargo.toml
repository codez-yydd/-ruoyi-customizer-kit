[package]
name = "ruoyi-forge"
version = "0.1.0"
description = "RuoYi Forge / 若依锻造台 — 若依新项目初始化快速定制工具"
authors = ["RuoYi Forge"]
edition = "2021"

[lib]
# `_lib` 后缀用于避免 lib 名与 bin 名冲突（Windows 上尤为关键）
name = "ruoyi_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地文件扫描与改造所需
walkdir = "2"
regex = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
serde_yaml = "0.9"
# admin 密码 BCrypt 加密（与 Spring Security BCryptPasswordEncoder 兼容）
bcrypt = "0.15"
# JWT 随机 secret 生成
rand = "0.8"

[dev-dependencies]
tempfile = "3"
